# Requer a rede compartilhada criada uma única vez na VPS:
#   docker network create web
# O reverse proxy (Caddy) vive fora deste compose e roteia para
# "jobapply-api" pela rede "web".
services:
  api:
    build: ./apps/jobapply-api
    container_name: jobapply-api
    restart: unless-stopped
    env_file: ./api.env
    networks: [web, internal]

  ats-agent:
    build: ./apps/ats-agent
    restart: unless-stopped
    env_file: ./agent.env
    networks: [internal]

  linkedin-agent:
    build: ./apps/linkedin-agent
    restart: unless-stopped
    env_file: ./linkedin.env
    networks: [internal]

networks:
  web:
    external: true
  internal:
